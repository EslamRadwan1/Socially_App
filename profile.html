  <body class="bg-gray-800">
    <main class="container mx-auto font-sans">
      <nav
        class="fixed top-0 left-3/6 z-100 -translate-x-3/6 w-full sm:w-3/4 mx-auto h-20 bg-gray-800 flex justify-between items-center px-4 shadow-md"
      >
        <div class="font-bevan text-3xl italic text-sky-500">Socially</div>

        <div
          id="buttons"
          class="flex flex-row-reverse items-center gap-4"
        ></div>
      </nav>

      <!-- Content -->
      <div
        id="profile-content-area"
        class="w-[99%] sm:w-3/4 mx-auto mt-24 space-y-2"
      >
        <!-- Profile Info -->
        <div
          class="flex justify-between items-center bg-gray-700 rounded-xl p-3"
        >
          <div class="space-y-4 text-white">
            <div>
              <div id="theName" class="text-2xl font-bold"></div>
              <div id="theUserName" class="text-sm text-gray-300"></div>
            </div>
            <div class="flex items-center gap-5">
              <div class="text-center">
                <span id="postsCount"></span>
                <p class="text-gray-300">Posts</p>
              </div>
              <div class="text-center">
                <span id="commentsCount"></span>
                <p class="text-gray-300">Comments</p>
              </div>
            </div>
          </div>
          <img
            id="userImg"
            src=""
            alt="profile image"
            class="size-25 rounded-full border-2 border-white object-cover"
          />
        </div>
        <!-- Posts -->
        <div class="profile-posts space-y-2 mt-7"></div>
      </div>
    </main>
    <script src="profile.js" type="module"></script>
  </body>
</html>
